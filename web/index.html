<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alertness</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<video id="view" playsinline muted></video>

<div id="panel">
  <p id="message" hidden><span id="spin"></span><span id="text"></span></p>
  <p id="reason" hidden></p>
  <div id="status">
    <span id="dot"></span><span id="state">未接続</span><span id="sent">0</span>
    <span id="actions">
      <button id="recal" type="button">測り直す</button>
      <button id="mute" type="button">音を消す</button>
    </span>
  </div>
</div>

<div id="alert" hidden role="alert">
  <div id="alert-card">
    <svg id="alert-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-drowsiness"></use></svg>
    <p id="alert-title"></p>
    <p id="alert-reason"></p>
  </div>
</div>

<div id="start">
  <div id="start-box">
    <div id="language-switch" role="group" aria-label="表示言語">
      <button type="button" data-locale="ja" aria-pressed="true">JP</button>
      <button type="button" data-locale="en" aria-pressed="false">EN</button>
    </div>
    <div id="sound-check" role="group" aria-label="警告音を聞く">
      <p id="sound-check-label">警告音を聞く</p>
      <button type="button" data-sound="drowsy">眠気</button>
      <button type="button" data-sound="distracted">脇見</button>
      <button type="button" data-sound="inattentive">注意散漫</button>
    </div>
    <button id="go" type="button">はじめる</button>
    <p id="start-error" role="alert" hidden></p>
  </div>
</div>

<svg hidden>
  <symbol id="icon-drowsiness" viewBox="0 0 24 24">
    <path d="M2.5 10c2.6 3.6 5.8 5.4 9.5 5.4s6.9-1.8 9.5-5.4"/>
    <path d="M6.2 14.2 4.6 16.6M12 15.4v2.9M17.8 14.2l1.6 2.4"/>
    <path d="M15 3.5h4l-4 4h4"/>
  </symbol>
  <symbol id="icon-distraction" viewBox="0 0 24 24">
    <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
    <circle cx="17" cy="12" r="2.6"/>
  </symbol>
  <symbol id="icon-inattentive" viewBox="0 0 24 24">
    <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
    <circle cx="12" cy="12" r="2.6"/>
    <path d="M12 1.5v2M4.5 4.5l1.4 1.4M19.5 4.5l-1.4 1.4"/>
  </symbol>
  <symbol id="icon-stress" viewBox="0 0 24 24">
    <path d="M2.5 12.5h4l2.2-5.5 4.2 11 2.4-5.5h6.2"/>
  </symbol>
  <symbol id="icon-face" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M9 10h.01M15 10h.01M9.5 15.5h5"/>
    <path d="M3.5 3.5l17 17"/>
  </symbol>
</svg>
