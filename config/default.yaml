# 既定設定。しきい値・窓幅・カメラ設定はここで一元管理し、コードには直書きしない。
# 用途を変える場合も、基本はこのファイルだけを編集すれば済むようにしている。

# target_fps は MJPG を要求したうえでカメラに渡す。多くの USB カメラは既定の非圧縮
# (YUY2) だと帯域が足りず 720p/30fps 頭打ちになる。
# 実効フレームレートは rPPG の精度を直接決める。合成波での実測では、10fps では窓長や
# 品質しきい値を何にしても心拍推定の1割が数十bpmずれるが、30fps + 20秒窓 + 品質0.4 なら
# 9割点が 6.5bpm に収まる。解像度より実効fpsを優先する（額のROIは小さいので 640x480 で足りる）。
# 出ている値は画面右下の debug 表示（fps 行＝実測値）で必ず確認すること。
camera:
  index: 0
  width: 1280
  height: 720
  target_fps: 30

source:
  type: webcam          # webcam / video
  # path: sample.mp4    # type=video のとき使う

detector:
  type: mediapipe       # MediaPipe FaceLandmarker (Tasks API)
  model_path: models/face_landmarker.task
  max_faces: 1
  output_blendshapes: true   # jawOpen=あくび, eyeBlink=瞬き の判定に使う

# キャリブレーション。EAR や頭部姿勢の基準は人・カメラ位置で大きく変わるため、
# 起動時に「その人の基準値」を取得して以降の判定を相対化する。
calibration:
  enabled: true
  mode: guided          # guided=案内付き / implicit=最初の数秒を基準とみなす
  duration_seconds: 3.0
  save_path: profiles/default.json   # 空文字なら保存しない

# 生特徴量の正規化。学習(Colab)と推論(ローカル)で必ず同じ変換を使うため、
# バージョンを付けて取り違えを防ぐ。
normalize:
  version: 1

# 何を判定するか（評価軸）。軸を増やせば判定対象がそのまま増える。
# 各軸は連続スコア(0..1)を持ち、levels でレベルに区切る。
# alert_on は軸の向き。既定の high はスコアが高いほど警告、low は低いほど警告（集中など、
# 高いほど良い軸）。スコア自体の意味は変えないので、記録・学習はそのまま使える。
assessment:
  dimensions:
    - name: drowsiness        # 眠気
      levels: { low: 0.3, medium: 0.6, high: 0.8 }
      cues: [eye_closure, blink, yawn, head_down]
    - name: distraction       # 注意逸脱
      levels: { low: 0.3, medium: 0.6, high: 0.8 }
      cues: [head_turn, gaze_off]
    - name: concentration     # 集中（視線が対象にあり、かつ走査もしているか。ML でも学習可）
      # 2つの cue が逆向きの失敗を1本ずつ担当する。attention_buffer=目が離れすぎ、
      # gaze_scanning=目が貼りついたまま動かない。combine は既定の max なので、
      # どちらが欠けても警告が立つ。
      levels: { low: 0.3, medium: 0.6, high: 0.8 }
      cues: [attention_buffer, gaze_scanning]
      alert_on: low           # 集中しているときではなく、していないときに警告する
      alert_name: inattentive
    - name: stress            # ストレス・苛立ち（心拍と表情の一致で rule 判定。ML でも学習可）
      levels: { low: 0.3, medium: 0.6, high: 0.8 }
      cues: [hr_elevation, facial_tension]
      # 心拍も表情も単独では特異度が低い（心拍は体動でも上がり、表情は照明や集中でも動く）。
      # weighted にして両者の一致を要求する。max だと片方だけで警告まで届いてしまう。
      combine: weighted

# 特徴ごとの判定器（cue）。重みと個別パラメータを持つ。
# パラメータ名は各 cue クラスの引数と一致させること。
cues:
  # 値は実データの分布に合わせて調整（closed_ratio は awake/drowsy の中間、
  # gaze は実測が 0.0〜0.06 程度だったので 0.05、頭部閾値も実測に寄せた）。
  eye_closure: { weight: 1.0, window_seconds: 30, perclos_drowsy: 0.4, closed_ratio: 0.6, max_yaw: 25 }
  blink:       { weight: 0.7, closed_ratio: 0.6, long_blink_seconds: 1.0, max_yaw: 25 }
  yawn:        { weight: 0.5, open_threshold: 0.4, min_seconds: 1.5 }
  head_down:   { weight: 0.8, pitch_down_deg: 12, sustained_seconds: 1.5 }
  head_turn:   { weight: 0.6, yaw_side_deg: 15, sustained_seconds: 1.5 }
  gaze_off:    { weight: 0.6, off_threshold: 0.035, off_screen_seconds: 2.0 }
  # 集中(走査): 視線が中心域に留まった割合(PRC)と水平視線のばらつき。留まりすぎ＝走査不足で
  # 下がる。視線を1点に固定するのは集中ではなく、認知負荷による視野狭窄の兆候。
  # prc_healthy は文献の 92% をそのまま使えない（アイトラッカー前提で尺度が違う）ため、
  # 自前のデータで較正すること。手元の収録では中心半径 0.035 で PRC 99% だった。
  gaze_scanning: { weight: 1.0, window_seconds: 30, center_radius: 0.035, prc_healthy: 0.85, prc_frozen: 1.0, min_spread: 0.004, min_window: 10 }
  # 集中: AttenD 方式の注意バッファ。対象を見ている間は残高が満ち、外れている間は減る。
  # capacity_seconds=2 は「前方から2秒視線を外すと車線内の位置把握が崩れる」という根拠から。
  # on_target_yaw_deg は広めにしてある。yaw_rel は起動時3秒のキャリブが基準なので、そのとき
  # 顔が少し傾いていると以降ずっと十数度ずれる。主たる判定は視線(gaze_on_threshold)に置き、
  # 頭部は「明らかに横を向いた」を弾く役に留める。ずれを感じたら 'c' で再キャリブできる。
  attention_buffer: { weight: 1.0, capacity_seconds: 2.0, latency_seconds: 0.1, gaze_on_threshold: 0.035, on_target_yaw_deg: 25, refill_rate: 1.0 }
  # ストレス(表情): 眉を寄せ(AU4)・まぶたを緊張させ(AU7)・唇を押しつける(AU24)動きの強さ。
  # 皺眉筋の活動は負の感情価と認知的努力の指標として長く検証されてきた。個人差が大きく
  # 向きも一様でないので、本人の安静との差だけを見て、単独では警告を立てない。
  facial_tension: { weight: 1.0, span: 0.15, sustained_seconds: 5.0, baseline_seconds: 120, min_rest_samples: 30, rest_interval: 1.0, freeze_at: 0.3, noise_k: 6.0 }
  # ストレス: rPPG の心拍が「本人の安静時」から上がると満点。基準も現在値も中央値で取る
  # （統計量を揃えないと、変化が無くても推定のばらつきぶん差が正に出る）。満点までの幅は
  # span_bpm と「ばらつき(MAD)×noise_k」の大きい方で、推定が粗いときほど大きな差を要求する。
  # span_bpm=10 と min_quality=0.6 は実収録（安静2分→暗算2分→回復2分）から決めた。
  # 暗算での心拍上昇は実測 +7.1bpm。当初の 25 は根拠のない見積もりで、実際の3倍以上あった。
  # 品質を上げるほど効果が強く出る（下限0.4で+0.3bpm、0.5で+5.8、0.6で+7.1、0.7で+8.7）ので、
  # 0.4〜0.5 では雑音が効果を打ち消していた。0.6 で 安静0% / 暗算96% / 回復0% に分離する。
  # 基準は cue 自身が持ち、スコアが freeze_at を超えている間は更新を止める。止めないと、
  # 上がった状態が新しい「安静」になり、baseline_seconds より長い負荷を見失う。
  # adaptive_baseline=true で履歴から安静時を推定する。その基準が出来上がるまでは判定を出さない
  # （require_calibration。baseline_seconds の6割＝既定 72 秒）。頭が max_motion_deg より振れている間は rPPG が当てにならないので
  # 判定を止め、直前の値を hold_seconds だけ保つ。
  hr_elevation: { weight: 1.0, span_bpm: 10, min_quality: 0.6, noise_k: 6.0, sustained_seconds: 5.0, baseline_bpm: 70, adaptive_baseline: true, baseline_seconds: 120, freeze_at: 0.3, require_calibration: true, max_motion_deg: 6.0, hold_seconds: 10.0, min_rest_samples: 30, rest_interval: 1.0 }

# カメラからの心拍推定（rPPG）。stress の特徴源。numpy だけの軽い処理なので既定で有効。
# 起動後 数秒ぶん貯まると各フレームに hr_bpm / rppg_quality が乗る。stress を使わない用途では
# false にしてよい（その分の計算を省ける）。
rppg:
  enabled: true
  window_seconds: 20          # 心拍推定に使う時間窓。短いと推定が跳ね、長いと反応が鈍る
  min_bpm: 42
  max_bpm: 180
  # HRV(RMSSD) は拍の時刻の精度で決まる。フレーム間隔のままだと 30fps で下限 22ms、
  # 60fps でも 11ms あり、人の安静時 RMSSD（20〜50ms）を測るには足りない。帯域制限補間で
  # 標本の間を埋めると 30fps で 3ms、60fps で 2ms まで下がる（合成波での実測）。
  # HRV は既定で無効。実収録で記録された RMSSD は中央値 225ms（拍間隔の24%）で、人の
  # 安静時 20〜50ms とは桁が違い、しかもストレス時に下がるべきところが上がっていた。
  # 拍の時刻の量子化は補間で解決したが、雑音の乗った脈波でのピーク検出そのものが崩れている。
  # 実装を直すまで判定には使わない（生理的にありえない値は出力側でも弾いている）。
  hrv_enabled: false
  hrv_upsample: 16            # 拍位置を求める前に標本を何倍に補間するか
  hrv_min_quality: 0.5        # 有効にした場合、この品質を超えた安定窓のときだけ出す

# cue の結果を統合して最終判定を出す方針
policy:
  type: rule_based            # ml にすると学習済みモデルで判定（要 pip install .[ml]）
  hysteresis_frames: 8        # 状態のちらつき防止（rule_based のみ）
  # type: ml                  # alertness-colab が作った model.pkl を読む判定に切替
  # model_path: models/model.pkl

feedback:
  window: true                # OpenCV ウィンドウに表示
  window_width: 0             # 表示の幅。0 なら撮影したままの大きさ。撮影解像度とは切り離して
                              # あるので、撮影を軽くしたまま表示だけ大きくすることもできる。
                              # ウィンドウは手でもドラッグして大きさを変えられる。
  draw_landmarks: true
  face_mesh: false            # true にすると顔全体のメッシュ（網目）を描く
  stress_meter: true          # 右上にストレスの安静基準キャリブの進行度バーを表示。
                              # 額の測定範囲もストレス段階の色で塗る
  timeline: stress            # 左下に推移の帯を出す軸名。空なら出さない
  timeline_seconds: 300       # 帯に収める時間（秒）
  debug: true                 # 画面右下に全特徴量を数値表示。しきい値調整時に使う
  alert_cooldown_seconds: 5.0
  audio: true                 # やわらかいチャイムで警告（Windows）
  sounds:                     # 評価軸ごとに鳴らす音（drowsy / distracted）
    drowsiness: drowsy
    distraction: distracted
    concentration: distracted # 注意が外れたときに鳴る（alert_on: low のため）

# 学習データの録画。--record で有効化すると各フレームの特徴量＋判定をCSVに残す。
recorder:
  enabled: false
  path: runs
